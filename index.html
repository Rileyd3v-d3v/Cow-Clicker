<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5e9e3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moo Clicker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="cow-icon.svg">
<title>Moo Clicker: Pasture Party</title>
<style>
:root{--green:#4d913b;--deep:#245c2a;--cream:#fff4d7;--wood:#9b5b2d;--ink:#3b2a1d;--gold:#ffd45d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#8ccf5a;min-height:100dvh;overflow-x:hidden}
.sky{position:fixed;inset:0 0 auto;height:34%;background:linear-gradient(#8bd8f5,#d6f4ff);z-index:-3}
.sun{position:fixed;right:9%;top:7%;width:64px;height:64px;background:#ffe88a;border-radius:50%;box-shadow:0 0 0 12px #ffe88a33;z-index:-2}
.hills{position:fixed;inset:auto 0 0;height:72%;z-index:-2;background:radial-gradient(ellipse at 15% 72%,#70bd49 0 25%,transparent 25.5%),radial-gradient(ellipse at 78% 75%,#63b242 0 31%,transparent 31.5%),linear-gradient(#8ccf5a 0 40%,#5da63e 40%);pointer-events:none}
.fence{position:fixed;left:0;right:0;bottom:8%;height:85px;z-index:-1;opacity:.9;pointer-events:none}
.fence:before{content:"";position:absolute;left:0;right:0;top:19px;height:18px;background:repeating-linear-gradient(90deg,#b8753d 0 44px,#87502a 44px 49px);border:4px solid #70401f;border-left:0;border-right:0;box-shadow:0 29px 0 -4px #b8753d,0 29px 0 0 #70401f}
.fence:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16px,#87502a 16px 22px, #d49a5c 22px 42px,#70401f 42px 48px,transparent 48px 74px)}
.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
header{text-align:center;background:#fff7dcdd;border:3px solid #fff;border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 #367d36;margin-bottom:12px}
h1{font-size:clamp(1.55rem,5vw,2.2rem);margin:0;color:#28602d;text-shadow:1px 2px #d4f3a4}
.subtitle{font-size:.88rem;margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#fff9e8;border:3px solid #fff;border-radius:16px;padding:9px;text-align:center;box-shadow:0 4px 0 #b9d78c}
.stat strong{display:block;font-size:clamp(1.05rem,4vw,1.4rem);color:#28602d}
.stat span{font-size:.78rem}
.play-area{background:#ffffffc9;border:3px solid #fff;border-radius:24px;padding:14px 10px 12px;text-align:center;box-shadow:0 5px 0 #367d36;margin-bottom:12px}
.prompt{font-weight:800;color:#3c742e;margin:0 0 4px}
.cow-button{border:0;background:transparent;display:block;margin:0 auto;width:min(70vw,280px);height:min(62vw,250px);max-height:250px;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 8px 0 #347f34);transition:transform .08s}
.cow-button:active{transform:scale(.94) rotate(-2deg)}
.cow{width:100%;height:100%;overflow:visible}
.cow .body{fill:#fffaf0;stroke:#4a382c;stroke-width:5}
.cow .patch{fill:#3b332f}
.cow .ear{fill:#fffaf0;stroke:#4a382c;stroke-width:5}
.cow .inner{fill:#f4a9a5}
.cow .muzzle{fill:#f4aaa5;stroke:#4a382c;stroke-width:4}
.cow .eye{fill:#302820}
.cow .shine{fill:#fff}
.cow .hoof{fill:#6d4934;stroke:#4a382c;stroke-width:3}
.cow .bell{fill:#ffd45d;stroke:#8b6127;stroke-width:3}
.click-hint{font-size:.82rem;color:#4d6840;margin-top:3px}
.float{position:fixed;pointer-events:none;font-weight:900;color:#fff;border:2px solid #fff;background:#5e9e3e;padding:5px 9px;border-radius:12px;text-shadow:0 1px #285a24;animation:pop .75s ease-out forwards;z-index:10}
@keyframes pop{to{transform:translateY(-75px) scale(1.15);opacity:0}}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}
button.small{border:0;border-radius:12px;background:#367c38;color:#fff;font-weight:800;padding:9px 12px;box-shadow:0 3px 0 #245b29}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px;color:#173f20;font-weight:900;font-size:1.15rem;text-shadow:0 1px #d5f4ad}
.shop{display:grid;grid-template-columns:1fr;gap:8px}
.upgrade{display:flex;align-items:center;gap:11px;text-align:left;width:100%;border:3px solid #fff;border-radius:17px;background:#fff8e5;padding:10px;color:var(--ink);box-shadow:0 4px 0 #a5ca76;min-height:78px}
.upgrade:disabled{opacity:.57;filter:grayscale(.35)}
.upgrade .emoji{font-size:2rem;width:44px;text-align:center;flex-shrink:0}
.upgrade .info{flex:1;min-width:0}
.upgrade .name{font-weight:900;font-size:1rem}
.upgrade .desc{font-size:.78rem;line-height:1.25;margin:2px 0}
.upgrade .cost{font-size:.83rem;font-weight:900;color:#357c32}
.upgrade .owned{font-size:.75rem;background:#e0f2c9;border-radius:20px;padding:4px 7px;white-space:nowrap}
.footer{text-align:center;font-size:.75rem;padding:16px 0 4px;color:#254d23;text-shadow:0 1px #c9ef9d}
@media(min-width:600px){.shop{grid-template-columns:1fr 1fr}.app{padding-top:20px}.play-area{padding:18px}}
</style>
</head>
<body>
<div class="sky"></div><div class="sun"></div><div class="hills"></div><div class="fence"></div>
<main class="app">
<header><h1>🐮 Moo Clicker</h1><div class="subtitle">Pasture Party — build the moo-st amazing farm!</div></header>
<div class="stats">
 <div class="stat"><strong id="milk">0</strong><span>🥛 Moo Points</span></div>
 <div class="stat"><strong id="rate">0 / sec</strong><span>🌱 Automatic moos</span></div>
</div>
<section class="play-area">
 <p class="prompt">Tap the cow for moo points!</p>
 <button class="cow-button" id="cowBtn" aria-label="Tap the cartoon cow to earn moo points">
 <svg class="cow highland-cow" viewBox="0 0 260 230" role="img" aria-label="Cute cartoon Highland cow with shaggy ginger fur">
  <ellipse cx="130" cy="211" rx="86" ry="11" fill="#4d8f37" opacity=".25"/>
  <path d="M61 148 Q25 143 31 119 Q37 108 47 126 Q50 137 66 130" fill="none" stroke="#4a382c" stroke-width="6" stroke-linecap="round"/>
  <!-- fluffy body -->
  <path d="M56 107 Q48 93 61 82 Q54 67 73 62 Q81 48 99 57 Q111 45 127 56 Q144 46 158 58 Q178 50 188 66 Q207 68 207 87 Q220 101 208 117 L203 170 Q198 188 181 188 L77 188 Q58 186 57 166Z" fill="#c8793e" stroke="#4a382c" stroke-width="5" stroke-linejoin="round"/>
  <!-- shaggy coat tufts -->
  <path d="M61 93 Q48 78 64 68 Q60 54 78 53 Q83 36 101 47 Q111 32 126 46 Q141 31 154 47 Q173 39 181 54 Q202 52 201 70 Q218 79 207 96 Q198 108 190 94 Q181 108 170 94 Q157 108 146 95 Q134 109 121 96 Q107 109 95 95 Q79 108 70 95Z" fill="#df9557" stroke="#4a382c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M78 112 Q92 99 105 114 L104 143 Q89 151 76 138Z" fill="#75452d"/>
  <path d="M158 124 Q177 106 195 124 L192 155 Q179 169 160 153Z" fill="#75452d"/>
  <path d="M122 157 Q135 145 148 160 L145 185 L121 185Z" fill="#75452d"/>
  <path d="M75 165 L103 165 L103 198 Q90 206 74 198Z" fill="#6d4934" stroke="#4a382c" stroke-width="3"/>
  <path d="M160 165 L188 165 L190 198 Q176 206 160 198Z" fill="#6d4934" stroke="#4a382c" stroke-width="3"/>
  <!-- ears -->
  <path d="M76 68 Q42 43 35 60 Q34 77 76 87Z" fill="#c8793e" stroke="#4a382c" stroke-width="5"/>
  <path d="M64 70 Q48 57 45 64 L67 79Z" fill="#eaa19a"/>
  <path d="M181 68 Q214 42 224 59 Q227 76 184 87Z" fill="#c8793e" stroke="#4a382c" stroke-width="5"/>
  <path d="M193 70 Q209 56 215 64 L190 79Z" fill="#eaa19a"/>
  <!-- curved Highland horns -->
  <path d="M89 54 Q70 43 75 26 Q84 37 98 42Z" fill="#fff0cf" stroke="#4a382c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M165 43 Q181 36 185 23 Q193 43 176 55Z" fill="#fff0cf" stroke="#4a382c" stroke-width="4" stroke-linejoin="round"/>
  <!-- face and long fringe -->
  <path d="M77 66 Q78 35 130 34 Q181 35 184 67 L177 103 Q169 122 131 124 Q91 121 82 102Z" fill="#e5a064" stroke="#4a382c" stroke-width="5"/>
  <path d="M81 59 Q75 40 93 35 Q97 18 115 29 Q127 13 141 29 Q160 17 169 34 Q187 33 184 53 Q173 70 160 59 Q147 76 133 60 Q117 75 105 59 Q91 71 81 59Z" fill="#c8793e" stroke="#4a382c" stroke-width="4" stroke-linejoin="round"/>
  <!-- eyes peeking out under fringe -->
  <ellipse cx="107" cy="77" rx="5.5" ry="8" fill="#302820"/><ellipse cx="109" cy="74" rx="2" ry="2.5" fill="#fff"/>
  <ellipse cx="155" cy="77" rx="5.5" ry="8" fill="#302820"/><ellipse cx="157" cy="74" rx="2" ry="2.5" fill="#fff"/>
  <!-- muzzle -->
  <ellipse cx="131" cy="99" rx="34" ry="23" fill="#f4aaa5" stroke="#4a382c" stroke-width="4"/>
  <ellipse cx="119" cy="98" rx="4" ry="5" fill="#b65f6d"/><ellipse cx="143" cy="98" rx="4" ry="5" fill="#b65f6d"/>
  <path d="M121 109 Q131 118 141 109" fill="none" stroke="#9a5555" stroke-width="3" stroke-linecap="round"/>
  <!-- little bell -->
  <path d="M122 127 Q137 120 151 127 L147 140 Q137 147 126 140Z" fill="#ffd45d" stroke="#8b6127" stroke-width="3"/><circle cx="137" cy="141" r="3" fill="#8b6127"/>
 </svg></button>
 <div class="click-hint">Every tap makes the farm grow 🌼</div>
 <div class="actions"><button class="small" id="saveBtn">Save farm</button><button class="small" id="resetBtn">Reset game</button></div>
</section>
<div class="section-title"><span>🌾 Farm upgrades</span><span style="font-size:.75rem">Buy more moo power!</span></div>
<section class="shop" id="shop"></section>
<div class="footer">Made with moo-velous farm vibes • Your progress saves on this device</div>
</main>
<script>
const upgrades=[
 {id:'clover',emoji:'🍀',name:'Clover Patch',desc:'+1 moo point per tap',base:15,power:1,kind:'tap'},
 {id:'bucket',emoji:'🥛',name:'Milk Bucket',desc:'+1 moo point per second',base:35,power:1,kind:'auto'},
 {id:'hay',emoji:'🌾',name:'Hay Bale Stack',desc:'+5 moo points per second',base:120,power:5,kind:'auto'},
 {id:'chicken',emoji:'🐔',name:'Farmyard Friends',desc:'+18 moo points per second',base:500,power:18,kind:'auto'},
 {id:'tractor',emoji:'🚜',name:'Tiny Tractor',desc:'+70 moo points per second',base:1800,power:70,kind:'auto'},
 {id:'barn',emoji:'🏡',name:'Cozy Red Barn',desc:'+260 moo points per second',base:7000,power:260,kind:'auto'},
 {id:'rainbow',emoji:'🌈',name:'Rainbow Sprinkler',desc:'+1,000 moo points per second',base:30000,power:1000,kind:'auto'},
 {id:'cowpal',emoji:'🐮',name:'Cow Bestie',desc:'Doubles moo points per tap',base:90000,power:2,kind:'mult'}
];
let state={milk:0,counts:{},tapPower:1,tapMult:1,last:Date.now()};
const $=id=>document.getElementById(id);
function fmt(n){if(n<1000)return Math.floor(n).toLocaleString();const units=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n>=100?0:n>=10?1:2)+units[i]}
function cost(u){return Math.floor(u.base*Math.pow(1.17,state.counts[u.id]||0))}
function autoRate(){return upgrades.reduce((s,u)=>s+(u.kind==='auto'?u.power*(state.counts[u.id]||0):0),0)}
function render(){
 $('milk').textContent=fmt(state.milk);$('rate').textContent=fmt(autoRate())+' / sec';
 $('shop').innerHTML='';
 upgrades.forEach(u=>{
  const c=cost(u),owned=state.counts[u.id]||0;
  const b=document.createElement('button');b.className='upgrade';b.disabled=state.milk<c;
  b.innerHTML=`<span class="emoji">${u.emoji}</span><span class="info"><span class="name">${u.name}</span><div class="desc">${u.desc}</div><span class="cost">Cost: ${fmt(c)} 🥛</span></span><span class="owned">Owned: ${owned}</span>`;
  b.addEventListener('click',()=>buy(u));$('shop').appendChild(b);
 });
}
function floatText(text,x,y){const el=document.createElement('div');el.className='float';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),800)}
let mooAudioContext=null;
function playMoo(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!mooAudioContext)mooAudioContext=new AudioCtx();
  if(mooAudioContext.state==='suspended')mooAudioContext.resume();
  const ctx=mooAudioContext, now=ctx.currentTime;
  const osc=ctx.createOscillator(), sub=ctx.createOscillator();
  const filter=ctx.createBiquadFilter(), gain=ctx.createGain();
  osc.type='sawtooth'; sub.type='triangle';
  osc.frequency.setValueAtTime(185,now);
  osc.frequency.exponentialRampToValueAtTime(92,now+0.24);
  osc.frequency.exponentialRampToValueAtTime(118,now+0.48);
  osc.frequency.exponentialRampToValueAtTime(78,now+0.82);
  sub.frequency.setValueAtTime(92,now);
  sub.frequency.exponentialRampToValueAtTime(58,now+0.7);
  filter.type='lowpass'; filter.frequency.setValueAtTime(620,now);
  filter.frequency.exponentialRampToValueAtTime(330,now+0.55);
  filter.Q.value=5;
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.linearRampToValueAtTime(0.24,now+0.06);
  gain.gain.setValueAtTime(0.20,now+0.34);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.9);
  osc.connect(filter);sub.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  osc.start(now);sub.start(now);osc.stop(now+0.92);sub.stop(now+0.92);
 }catch(err){}
}
function tap(e){playMoo();const gain=state.tapPower*state.tapMult;state.milk+=gain;const r=e.currentTarget.getBoundingClientRect();floatText('+'+fmt(gain)+' 🥛',r.left+r.width*.55,r.top+25);render();save(false)}
function buy(u){const c=cost(u);if(state.milk<c)return;state.milk-=c;state.counts[u.id]=(state.counts[u.id]||0)+1;if(u.kind==='tap')state.tapPower+=u.power;if(u.kind==='mult')state.tapMult*=u.power;render();save(false)}
function save(show=true){state.last=Date.now();localStorage.setItem('mooClickerSave',JSON.stringify(state));if(show){$('saveBtn').textContent='Saved! ✓';setTimeout(()=>$('saveBtn').textContent='Save farm',1100)}}
function load(){try{const s=JSON.parse(localStorage.getItem('mooClickerSave'));if(s){state={...state,...s};state.counts=state.counts||{}}}catch(e){}}
$('cowBtn').addEventListener('click',tap);$('saveBtn').addEventListener('click',()=>save(true));
$('resetBtn').addEventListener('click',()=>{if(confirm('Start a brand-new farm? Your current farm save will be erased.')){localStorage.removeItem('mooClickerSave');state={milk:0,counts:{},tapPower:1,tapMult:1,last:Date.now()};render()}});
load();render();
let previous=Date.now();setInterval(()=>{const now=Date.now(),dt=Math.min((now-previous)/1000,10);previous=now;state.milk+=autoRate()*dt;render();if(Math.floor(now/5000)!==Math.floor((now-dt*1000)/5000))save(false)},250);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
